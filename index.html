    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        * { font-family: 'Pretendard', system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #D9CFC0; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .sortable-ghost { opacity: 0.4; background-color: #FFF3EF; }
        .place-item { z-index: 10; position: relative; transition: box-shadow 0.2s ease, transform 0.15s ease; }

        html { scroll-behavior: smooth; }
        .cursor-grab { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .route-connector { position: relative; }
        .route-connector::before {
            content: ''; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px;
            background-image: linear-gradient(to bottom, #D9CFC0 60%, transparent 0%);
            background-size: 2px 8px; background-repeat: repeat-y; transform: translateX(-50%); z-index: 0;
        }
        .map-fab { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .map-fab:hover { transform: translateY(-1px); }
        @keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-card { animation: modalIn 0.18s ease-out; }
        #tripSelect option, .cat-badge option { color: #163A5C; background-color: #ffffff; }

        /* --- 라이트 테마 PDF 인쇄 전용 스타일 --- */
        @media screen {
            #custom-print-container { display: none !important; }
        }

        @media print {
            body > *:not(#custom-print-container) { display: none !important; }
            
            body, html {
                background: #ffffff !important; 
                margin: 0; padding: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                height: auto !important;
            }

            #custom-print-container {
                display: block !important;
                width: 100%;
                background: #ffffff !important;
                color: #232B33 !important;
                font-family: 'Pretendard', sans-serif;
            }

            .print-page {
                page-break-after: always;
                page-break-inside: avoid;
                min-height: 100vh;
                background: #ffffff !important;
                box-sizing: border-box;
            }
            .print-page:last-child { page-break-after: auto; }

            .print-map-img {
                width: 100%;
                height: 45vh; 
                object-fit: cover;
                display: block;
                border: none;
                border-bottom: 3px solid #EB5A3C !important;
            }

            .print-content {
                padding: 40px 50px;
            }

            .print-day-title {
                font-family: 'Georgia', 'Times New Roman', serif;
                font-size: 3.5rem;
                font-weight: bold;
                margin: 0 0 30px 0;
                letter-spacing: -1px;
                border-bottom: 2px solid #F4EFE6 !important;
                padding-bottom: 20px;
                color: #0F2740 !important;
            }

            .print-timeline {
                position: relative;
                padding-left: 28px;
                margin-top: 10px;
            }

            .print-timeline::before {
                content: ''; 
                position: absolute; 
                left: 7px; top: 12px; bottom: 0;
                width: 2px; 
                background: #EAE2D4 !important;
            }

            .print-timeline-item {
                position: relative;
                margin-bottom: 35px;
                page-break-inside: avoid;
            }

            .print-timeline-item .node {
                position: absolute; 
                left: -28px; top: 4px;
                width: 16px; height: 16px;
                border: 4px solid #EB5A3C !important;
                border-radius: 50%;
                background: #ffffff !important;
                z-index: 1;
            }

            .cat-label {
                font-size: 0.85rem;
                font-weight: 800;
                color: #EB5A3C !important;
                margin-bottom: 4px;
                display: inline-block;
            }

            .place-name {

                background: #FAF7F2 !important;
                padding: 10px 14px;
                border-radius: 8px;
                border: 1px solid #EAE2D4 !important;
            }
        }

        async function fetchRates() {
            if (exchangeRatesCache && (Date.now() - exchangeRatesCache.timestamp < 86400000)) {
                return exchangeRatesCache.rates;
            }
            if (isFetchingRates) return null;
            isFetchingRates = true;

                const res = await fetch('https://open.er-api.com/v6/latest/KRW');
                const data = await res.json();

        function haversineKm(lat1, lng1, lat2, lng2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function decodePolyline(encoded) {
            let points = []; let index = 0, len = encoded.length; let lat = 0, lng = 0;
            while (index < len) {
                let b, shift = 0, result = 0; do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20); lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0; do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20); lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                points.push({ lat: lat / 1e5, lng: lng / 1e5 });
            }
            return points;
        }

        async function fetchRoutesApi(origin, destination, travelMode) {
            const body = { origin: { location: { latLng: { latitude: origin.lat, longitude: origin.lng } } }, destination: { location: { latLng: { latitude: destination.lat, longitude: destination.lng } } }, travelMode: travelMode, languageCode: 'ko', units: 'METRIC' };
            if (travelMode === 'DRIVE') body.routingPreference = 'TRAFFIC_AWARE';
            try {
                const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY, 'X-Goog-FieldMask': 'routes.distanceMeters,routes.polyline.encodedPolyline' }, body: JSON.stringify(body) });
                const json = await res.json(); if (!res.ok || !json.routes || !json.routes.length) return null;
                return json.routes[0];
            } catch (e) { return null; }
        }

        const routesApiCache = new Map(); let routesQueueTail = Promise.resolve();
        function queueRoutesApiRequest(origin, destination, travelMode, cacheKey) {
            if (routesApiCache.has(cacheKey)) return Promise.resolve(routesApiCache.get(cacheKey));
            const run = () => fetchRoutesApi(origin, destination, travelMode).then(route => { routesApiCache.set(cacheKey, route); return route; });
            const resultPromise = routesQueueTail.then(run); routesQueueTail = resultPromise.then(() => new Promise(r => setTimeout(r, 150))); return resultPromise;
        }

        async function calcExchange(isReverse = false, init = false) {
            const cur = document.getElementById('exTargetCur').value;
            const infoEl = document.getElementById('exRateInfo');
            let rateToKrw = 1;

            if (cur === 'CUSTOM') {
                rateToKrw = customExRate;
                infoEl.textContent = `설정한 수동 환율: 1 외화 = ${rateToKrw.toLocaleString()} 원`;
            } else {
                const rates = await fetchRates();
                if (!rates || !rates[cur]) {
                    infoEl.textContent = '인터넷 연결을 확인해주세요. 환율 정보를 불러올 수 없습니다.';
                    return;
                }
                rateToKrw = 1 / rates[cur]; 
                infoEl.textContent = `현재 환율: 1 ${cur} = 약 ${Math.round(rateToKrw).toLocaleString()} 원`;
            }
            
            if (init) return;
            
            const targetInput = document.getElementById('exTargetVal');
            const krwInput = document.getElementById('exKrwVal');
            
            if (!isReverse) {
                const val = parseFloat(targetInput.value);
                krwInput.value = isNaN(val) ? '' : Math.round(val * rateToKrw);
            } else {
                const val = parseFloat(krwInput.value);
                targetInput.value = isNaN(val) ? '' : (val / rateToKrw).toFixed(2);
            }
        }

            const days = Math.floor(totalMinutes / (24 * 60)); const hours = Math.floor((totalMinutes % (24 * 60)) / 60); const minutes = totalMinutes % 60;

        function viewVoucherModal(resId) {

            openModal(`<div class="p-6"><div class="flex justify-between items-start mb-4"><div class="flex-1 min-w-0 pr-2"><h2 class="font-bold text-navy-900 text-lg break-words">${res.title}</h2><p class="text-xs text-ink-500 mt-1 break-words">${res.date ? `일시: ${res.date} | ` : ''}메모: ${res.note}</p>${res.link ? `<a href="${res.link.startsWith('http') ? res.link : 'https://'+res.link}" target="_blank" class="text-xs text-coral-500 hover:underline block mt-1 break-all">🔗 웹사이트로 이동</a>` : ''}${(res.type==='transport' && res.departTime && res.arriveTime) ? `<p class="text-xs font-bold text-coral-600 mt-1">🕒 ${res.departTime} ~ ${res.arriveTime} <span class="text-red-500">${res.dateChange || ''}</span></p>` : ''}</div><button onclick="closeModal()" class="text-ink-400 hover:text-red-500 font-bold text-xl leading-none shrink-0">✕</button></div>${voucherHtml}</div>`);
        }

        function openMemoModal(placeId) {
            const { p } = getPlaceAndDay(placeId); if (!p) return;
            let costText = '';
            if (p.cost) {
                if (!p.currency || p.currency === 'KRW') costText = `${Number(p.cost).toLocaleString()}원`;
                else if (p.currency === 'CUSTOM' || ['USD', 'EUR', 'JPY', 'CNY'].includes(p.currency)) { const rate = p.customRate ? Number(p.customRate) : 0; const converted = Math.round(Number(p.cost) * rate); costText = `${Number(p.cost).toLocaleString()} (약 ${converted.toLocaleString()}원)`; } 
                else { const curSym = p.currency === 'USD' ? '$' : p.currency === 'EUR' ? '€' : p.currency === 'CNY' ? '¥(위안)' : '¥'; costText = `${curSym}${Number(p.cost).toLocaleString()}`; }
            }
            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-start mb-3">
                        <h2 class="font-bold text-navy-900 text-lg break-words pr-2">📝 ${p.name}</h2>

                    ${p.url ? `<a href="${p.url.startsWith('http') ? p.url : 'https://'+p.url}" target="_blank" class="text-xs text-coral-500 hover:underline block mt-3 break-all">🔗 ${p.url}</a>` : ''}
                    ${p.cost ? `<div class="mt-3 pt-3 border-t border-sand-200 text-xs font-bold text-ink-600">💰 예상 비용: <span class="text-coral-600">${costText}</span></div>` : ''}
                </div>

        function renderReservations() {

            if(trip.reservations.length === 0) { container.innerHTML = '<div class="text-center text-sm text-ink-400 py-6">등록된 예약이 없습니다.</div>'; return; }
            
            const filterVal = document.getElementById('resFilter') ? document.getElementById('resFilter').value : 'all';
            let filtered = trip.reservations;
            if (filterVal !== 'all') filtered = filtered.filter(r => r.type === filterVal);
            
            filtered.sort((a,b) => (a.cleared === b.cleared ? 0 : a.cleared ? 1 : -1));

            filtered.forEach(r => {

        function addChecklistItem() { const input = document.getElementById('checklistInput'); const text = input.value.trim(); if(!text) return; const trip = getCurrentTrip(); trip.checklists.push({ id: Date.now(), text: text, done: false }); input.value = ''; saveData(); renderChecklist(); }

        function deleteChecklist(id) { const trip = getCurrentTrip(); trip.checklists = trip.checklists.filter(c => c.id !== id); saveData(); renderChecklist(); }

                                        </select>
                                        ${place.currency && place.currency !== 'KRW' ? `<input type="number" onchange="updatePlaceField(${place.id}, 'customRate', this.value)" value="${place.customRate || ''}" placeholder="환율(원)" class="w-[50px] p-1 md:p-1.5 border border-sand-200 rounded bg-white outline-none text-[10px]">` : ''}
                                        <input type="number" onchange="updatePlaceField(${place.id}, 'cost', this.value)" value="${place.cost || ''}" placeholder="금액" class="flex-1 w-[40px] p-1 md:p-1.5 border border-sand-200 rounded bg-white outline-none text-[10px]">
                                    </div>
                                </div>
                            </div>
                            ${index > 0 ? `<div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-[9px] md:text-[10px] font-bold text-ink-500">출발 시간 (이전 장소)</label><input type="time" onchange="updatePlaceField(${place.id}, 'departTime', this.value)" value="${place.departTime || ''}" class="w-full p-1 md:p-1.5 mt-0.5 border border-sand-200 rounded bg-white outline-none" ${hasRes ? 'title="차량/도보 시에는 자동계산이 우선 적용됩니다."' : ''}></div><div><label class="text-[9px] md:text-[10px] font-bold text-ink-500">도착 시간 (이곳에)</label><input type="time" onchange="updatePlaceField(${place.id}, 'arriveTime', this.value)" value="${place.arriveTime || ''}" class="w-full p-1 md:p-1.5 mt-0.5 border border-sand-200 rounded bg-white outline-none" ${hasRes ? 'title="차량/도보 시에는 자동계산이 우선 적용됩니다."' : ''}></div></div>` : ''}
                            <div class="mb-2"><label class="text-[9px] md:text-[10px] font-bold text-ink-500">연동할 예약/바우처 (시간 자동 반영)</label><select onchange="updatePlaceField(${place.id}, 'linkedResId', this.value)" class="w-full p-1 md:p-1.5 mt-0.5 border border-sand-200 rounded bg-white outline-none"><option value="">선택 안 함</option>${trip.reservations.map(r => `<option value="${r.id}" ${place.linkedResId == r.id ? 'selected':''}>${r.title}</option>`).join('')}</select></div>
                            <div class="mb-2"><label class="text-[9px] md:text-[10px] font-bold text-ink-500">링크 (URL)</label><input type="text" onchange="updatePlaceField(${place.id}, 'url', this.value)" value="${place.url || ''}" placeholder="예: https://maps.google.com/..." class="w-full p-1 md:p-1.5 mt-0.5 border border-sand-200 rounded bg-white outline-none"></div>
                            <div><label class="text-[9px] md:text-[10px] font-bold text-ink-500">메모</label><textarea onchange="updatePlaceField(${place.id}, 'memo', this.value)" class="w-full mt-0.5 p-1 md:p-2 border border-sand-200 rounded bg-white h-10 resize-none outline-none">${place.memo || ''}</textarea></div>
                        </div>
                    `;
                    zone.appendChild(item);

                    if (index < dayPlaces.length - 1) {
                        const nextPlace = dayPlaces[index + 1]; const routeInfo = document.createElement('div'); routeInfo.className = "route-connector flex items-center justify-center gap-1 md:gap-1.5 py-1.5 relative z-0";
                        
                        if (foodFilterState !== 0) {
                            routeInfo.classList.add('hidden');
                        }

                        routeInfo.innerHTML = `
                            <div class="relative z-10 flex items-center gap-1 md:gap-1.5 bg-sand-50 px-1.5 rounded-full">
                                <select onchange="updatePlaceField(${nextPlace.id}, 'transport', this.value)" class="bg-white border border-sand-200 rounded-full px-2 py-0.5 text-[9px] md:text-[11px] font-bold text-ink-600 outline-none shadow-card cursor-pointer">
                                    <option value="car" ${!nextPlace.transport || nextPlace.transport==='car'?'selected':''}>🚗 차량</option><option value="walk" ${nextPlace.transport==='walk'?'selected':''}>🚶 도보</option><option value="transit" ${nextPlace.transport==='transit' || nextPlace.transport==='flight' ? 'selected' : ''}>✈️/🚌 항공/대중교통</option>
                                </select>
                                <span id="route-result-${dIdx}-${index}" class="text-[9px] md:text-[11px] text-ink-500 font-semibold">(계산 중...)</span>
                            </div>
                        `;
                        zone.appendChild(routeInfo);
                    }
                });
                listEl.appendChild(zone);
            };

            if (appData.currentDayIndex === 'all') trip.days.forEach((dayPlaces, dIdx) => renderDayPlaces(dayPlaces, dIdx, true)); else renderDayPlaces(trip.days[appData.currentDayIndex] || [], appData.currentDayIndex, false);

            if(window.placeSortables) window.placeSortables.forEach(s => s.destroy());
            window.placeSortables = [];
            document.querySelectorAll('.day-sortable-zone').forEach(zone => {
                window.placeSortables.push(new Sortable(zone, {
                    group: 'sharedPlaces',
                    animation: 150, handle: '.cursor-grab', ghostClass: 'sortable-ghost', draggable: '.place-item', delay: 150, delayOnTouchOnly: true,
                    onEnd: function () {
                        const trip = getCurrentTrip();
                        if (appData.currentDayIndex === 'all') {
                            const newDays = [];
                            document.querySelectorAll('.day-sortable-zone').forEach(z => {
                                const dayArr = [];
                                z.querySelectorAll('.place-item').forEach(el => {
                                    const id = parseInt(el.getAttribute('data-id'));
                                    let foundPlace = null;
                                    for (const d of trip.days) { const p = d.find(x => x.id === id); if (p) { foundPlace = p; break; } }
                                    if (foundPlace) dayArr.push(foundPlace);
                                });
                                newDays.push(dayArr);
                            });
                            trip.days = newDays;
                        } else {
                            const newPlaces = [];
                            document.querySelector('.day-sortable-zone').querySelectorAll('.place-item').forEach(el => {
                                const id = parseInt(el.getAttribute('data-id'));
                                newPlaces.push(trip.days[appData.currentDayIndex].find(p => p.id === id));
                            });
                            trip.days[appData.currentDayIndex] = newPlaces;
                        }
                        saveData(); renderUI(true);
                    }
                }));
            });
            renderMapRoutes(preserveView);
        }

        function buildMarkerIcon(color, catIcon, label) {
            const safeIcon = catIcon || '📍';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="${color}" stroke="white" stroke-width="2"/><text x="14" y="12" font-size="7" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif">${safeIcon}</text><text x="14" y="20" font-size="9" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif">${label}</text></svg>`;
            return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new google.maps.Size(28, 28), anchor: new google.maps.Point(14, 14) };
        }

        function renderMapRoutes(preserveView = true) {
            const currentRenderId = Date.now(); latestRenderId = currentRenderId;
            mapLayers.forEach(layer => layer.setMap(null)); mapLayers = [];
            const trip = getCurrentTrip(); let allLatLngs = [];
            trip.days.forEach((dayPlaces, dayIndex) => {
                if (appData.currentDayIndex !== 'all' && dayIndex !== appData.currentDayIndex) return;

                const defaultColor = dayColors[dayIndex % dayColors.length];
                dayPlaces.forEach((place, pIndex) => {
                    const markerColor = place.visited ? '#9ca3af' : defaultColor; const catIcon = categories[place.category || 'sightseeing'].label.split(' ')[0]; 
                    const marker = new google.maps.Marker({ position: { lat: place.lat, lng: place.lng }, map: map, icon: buildMarkerIcon(markerColor, catIcon, place.visited ? '✓' : String(pIndex + 1)), title: place.name });
                    const info = new google.maps.InfoWindow({ content: `<div style="text-align:center;"><b style="font-size:12px; ${place.visited ? 'text-decoration: line-through; color: gray;' : ''}">${place.name}</b><br><span style="font-size:10px;color:gray;">Day ${dayIndex + 1}</span></div>` });
                    marker.addListener('click', () => info.open(map, marker));
                    mapLayers.push(marker); allLatLngs.push({ lat: place.lat, lng: place.lng });
                });
            });
            if (!preserveView && allLatLngs.length > 0) { if (allLatLngs.length > 1) { const bounds = new google.maps.LatLngBounds(); allLatLngs.forEach(p => bounds.extend(p)); map.fitBounds(bounds, 20); } else { map.panTo(allLatLngs[0]); map.setZoom(14); } }

            for (let dayIndex = 0; dayIndex < trip.days.length; dayIndex++) {
                if (appData.currentDayIndex !== 'all' && dayIndex !== appData.currentDayIndex) continue;

                const dayPlaces = trip.days[dayIndex]; const baseColor = dayColors[dayIndex % dayColors.length];
                for (let i = 1; i < dayPlaces.length; i++) {
                    const p1 = dayPlaces[i-1]; const p2 = dayPlaces[i]; const segmentColor = (p1.visited && p2.visited) ? '#9ca3af' : baseColor; const transport = p2.transport || 'car'; const tMeta = transportMeta[transport] || transportMeta['car'];
                    let isActiveSegment = true; if (window.highlightedPlaceId) isActiveSegment = (p1.id === window.highlightedPlaceId || p2.id === window.highlightedPlaceId);
                    const activeSegmentColor = isActiveSegment ? segmentColor : '#d1d5db'; const strokeOpacity = isActiveSegment ? 1.0 : 0.3; const haloOpacity = isActiveSegment ? 0.9 : 0.2; const zIdx = isActiveSegment ? 4 : 2;

                    if (tMeta.profile) {
                        const origin = { lat: p1.lat, lng: p1.lng }; const destination = { lat: p2.lat, lng: p2.lng };
                        const cacheKey = `${tMeta.profile}:${p1.lat.toFixed(5)},${p1.lng.toFixed(5)}-${p2.lat.toFixed(5)},${p2.lng.toFixed(5)}`;
                        queueRoutesApiRequest(origin, destination, tMeta.profile, cacheKey).then(route => {
                            if (latestRenderId !== currentRenderId) return;
                            if (route && route.polyline && route.polyline.encodedPolyline) {
                                const path = decodePolyline(route.polyline.encodedPolyline);
                                const halo = new google.maps.Polyline({ path, strokeColor: '#ffffff', strokeWeight: 6, strokeOpacity: haloOpacity, map, zIndex: zIdx - 1 });
                                const line = new google.maps.Polyline({ path, strokeColor: activeSegmentColor, strokeWeight: 4, strokeOpacity: strokeOpacity, map, zIndex: zIdx });
                                mapLayers.push(halo, line);
                                if (dayIndex === appData.currentDayIndex || appData.currentDayIndex === 'all') { const distKm = route.distanceMeters / 1000; const avgMin = Math.max(1, Math.round((distKm / tMeta.speed) * 60)); updateRouteResult(dayIndex, i - 1, p2, avgMin, distKm, transport, false); }
                            } else { drawFallback(p1, p2, segmentColor, dayIndex, i - 1, transport, isActiveSegment); }
                        });
                    } else { drawFallback(p1, p2, segmentColor, dayIndex, i - 1, transport, isActiveSegment); }
                }
            }
        }

        function drawFallback(p1, p2, color, dayIndex, pIndex, transport, isActiveSegment = true) {
            const activeColor = isActiveSegment ? color : '#d1d5db'; const opacity = isActiveSegment ? 1 : 0.3; const zIdx = isActiveSegment ? 4 : 2;
            const polyline = new google.maps.Polyline({ path: [{ lat: p1.lat, lng: p1.lng }, { lat: p2.lat, lng: p2.lng }], strokeColor: activeColor, strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: opacity, strokeColor: activeColor, scale: 3 }, offset: '0', repeat: '12px' }], map: map, zIndex: zIdx });
            mapLayers.push(polyline);
            if (dayIndex === appData.currentDayIndex || appData.currentDayIndex === 'all') {
                try {
                    const tMeta = transportMeta[transport] || transportMeta['car']; const distKm = haversineKm(p1.lat, p1.lng, p2.lat, p2.lng); const avgMin = Math.max(1, Math.round((distKm / (tMeta.speed || 60)) * 60));
                    updateRouteResult(dayIndex, pIndex, p2, avgMin, distKm, transport, true);
                } catch (e) { const resultEl = document.getElementById(`route-result-${dayIndex}-${pIndex}`); if (resultEl) resultEl.innerHTML = `<span class="text-red-500 font-bold ml-1">계산 오류</span>`; }
            }
        }

        (function initPlannerDrag() {
            const panel = document.getElementById('plannerPanel'); const handle = document.getElementById('dragHandle'); const MIN_VH = 60; const MAX_VH = 92;
            function isMobileLayout() { return window.innerWidth < 768; } function getCurrentHeightVh() { return (panel.getBoundingClientRect().height / window.innerHeight) * 100; }
            let startY = 0; let startVh = MIN_VH; let dragging = false;
            function dragStart(clientY) { if (!isMobileLayout()) return; dragging = true; startY = clientY; startVh = getCurrentHeightVh(); }
            function dragMove(clientY) { if (!dragging || !isMobileLayout()) return; const deltaVh = ((startY - clientY) / window.innerHeight) * 100; panel.style.height = Math.max(MIN_VH, Math.min(MAX_VH, startVh + deltaVh)) + 'vh'; }
            function dragEnd() { dragging = false; }
            handle.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientY), { passive: true }); handle.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientY), { passive: true }); handle.addEventListener('touchend', dragEnd); handle.addEventListener('touchcancel', dragEnd);
            handle.addEventListener('mousedown', (e) => { dragStart(e.clientY); const onMove = (ev) => dragMove(ev.clientY); const onUp = () => { dragEnd(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }; document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); });
            window.addEventListener('resize', () => { if (!isMobileLayout()) { panel.style.height = ''; return; } if (panel.style.height) panel.style.height = Math.max(MIN_VH, Math.min(MAX_VH, getCurrentHeightVh())) + 'vh'; });
        })();

        document.addEventListener('wheel', function(e) {
            if (e.deltaY === 0) return;
            const container = e.target.closest('.mouse-scroll-x');
            if (container) {
                if (container.scrollWidth > container.clientWidth) {
                    e.preventDefault(); 
                    container.scrollLeft += e.deltaY;
                }
            }
        }, { passive: false });
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBd0A0sGcExr8UkA2k6R6GaV0JS2MKgDME&libraries=places&language=ko&region=KR&loading=async&callback=initMap" async defer></script>
